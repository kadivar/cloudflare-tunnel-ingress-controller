# Default values for cloudflare-tunnel-ingress-controller.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

cloudflare:
  accountId: ""
  tunnelName: ""
  apiToken: ""

  # Uncomment if you would like to use an existing secret instead of the creating a new one.
  # secretRef:
  #   name: cloudflare-external-secret
  #   accountIDKey: account_id
  #   tunnelNameKey: tunnel_name
  #   apiTokenKey: api_token

ingressClass:
  name: cloudflare-tunnel
  controllerValue: strrl.dev/cloudflare-tunnel-ingress-controller
  isDefaultClass: false

replicaCount: 1

image:
  repository: cr.strrl.dev/strrl/cloudflare-tunnel-ingress-controller
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

podAnnotations: {}

podSecurityContext:
  {}
  # fsGroup: 2000

securityContext:
  {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

resources:
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  limits:
    cpu: 100m
    memory: 128Mi
  requests:
    cpu: 100m
    memory: 128Mi

nodeSelector: {}

tolerations: []

affinity: {}

cloudflared:
  image:
    repository: cloudflare/cloudflared
    pullPolicy: IfNotPresent
    tag: latest
  replicaCount: 1
  protocol: auto
  # If set (e.g. "6" for IPv6-only workers), exported as TUNNEL_EDGE_IP_VERSION on the connector pod. See cloudflared run-parameters.
  edgeIpVersion: ""
  # Extra arguments to pass to cloudflared command
  # Example: ["--post-quantum", "--edge-ip-version", "4"]
  extraArgs: []
  # Optional connector pod spec (hostNetwork + dnsConfig for dual DNS: cluster + external, e.g. IPv6-only nodes)
  connectorPodSpec:
    hostNetwork: false
    dnsPolicy: "" # None, Default, or ClusterFirstWithHostNet. Use None with dnsConfig for cluster + external DNS.
    dnsConfig:
      nameservers: [] # e.g. [cluster-dns-ip, 2606:4700:4700::1111, 2606:4700:4700::1001]
      searches: []   # e.g. [svc.cluster.local, cluster.local]
    nodeSelectorWorker: false # if true, connector runs only on nodes with node-role.kubernetes.io/worker
    spreadOnePerNode: false   # if true, pod anti-affinity spreads one connector per node

cloudflaredServiceMonitor:
  create: false
  jobLabel: ""
  interval: ""
  scrapeTimeout: ""
  honorLabels: false
  metricRelabelings: []
  relabelings: []
  labels: {}
  scheme: http
